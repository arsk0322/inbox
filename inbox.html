<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="love & delicious IN the box">
    <title>love & delicious IN the box|INBOX 瑩盒甜點製作</title>
    <link rel="stylesheet" href="inbox.css">
    <link rel="short icon" href="logo.png">
    <link rel="stylesheet" href="animate.css-4.1.1/animate.min.css">
    <link rel="stylesheet" href="fontawesome-free-6.6.0-desktop/">
    <link rel="stylesheet" href="lightbox2-2.11.4/dist/css/lightbox.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="inbox/jquery-3.7.1.min.js"></script>
    <script src="inbox.js"></script>
    <script src="https://kit.fontawesome.com/721e790fc1.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <div class="header-top">
                <a class="logo-home" href="https://www.google.com">
                <img src="logo.png"></a>
                <p>一人工作室無店面，預定制</p>
                <div class="header-right">
                <ul class="search">
                    <li>
                        <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
                        <div class="text">
                            <textarea name="" id="" cols="20" rows=""></textarea>
                    </li>

                <ul class="cart">
                    <li>
                        <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
                    </li>
                </div>
            </div>
            <div class="header-middle">
                <h1>Inbox Patisserie</h1>
            </div>
            </div>
            <div class="header-end">
                <div class="dropdown">
                    <a href="https://www.google.com" class="dropdown-btn">首頁</a>
                </div>
                <div class="dropdown">
                    <a href="https://www.google.com" class="dropdown-btn">新品推出</a>
                    <ul class="menu">
                    <li><a href="https://www.google.com">Link1</a></li>
                    <li><a href="https://www.google.com">Link2</a></li>
                    <li><a href="https://www.google.com">Link3</a></li>
                    </ul>
                </div>
                <div class="dropdown">
                    <a href="https://www.google.com" class="dropdown-btn">熱門商品</a>
                    <ul class="menu">
                    <li><a href="https://www.google.com">Link1</a></li>
                    <li><a href="https://www.google.com">Link2</a></li>
                    <li><a href="https://www.google.com">Link3</a></li>
                    </ul>
                </div>
                <div class="dropdown">
                    <a href="https://www.google.com" class="dropdown-btn">所有商品</a>
                    <ul class="menu">
                    <li><a href="https://www.google.com">Link1</a></li>
                    <li><a href="https://www.google.com">Link2</a></li>
                    <li><a href="https://www.google.com">Link3</a></li>
                    </ul>
                </div>
                <div class="dropdown">
                    <a href="https://www.google.com" class="dropdown-btn">關於我們</a>
                </div>
            </div>
        </div>
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
              <a class="swiper-slide" href="#"><img src="active1.jpg"></a>
              <a class="swiper-slide" href="#"><img src="active2.jpg"></a>
              <a class="swiper-slide" href="#"><img src="active3.jpg"></a>
              <a class="swiper-slide" href="#"><img src="active4.jpg"></a>
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination"></div>
        </div>
        
            <!-- Swiper JS -->
        <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
          <!-- Initialize Swiper -->
          <script>
        //載入mySwiper 的swiper樣式
            var swiper = new Swiper(".mySwiper", {
              autoplay: {
              delay: 3000,
              disableOnInteraction: false,
              },
              slidesPerView: 3,
              spaceBetween: 110,
              loop: true,
              pagination: {
                el: ".swiper-pagination",
                clickable: true,
              },
              navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
              },
            });
          </script>

        <section>
            <div class="lightbox-wrap">
                <a class="example-image-link" href="dessert1.jpg" data-lightbox="example-set" data-title="The next image in the set is preloaded as you're viewing."><img class="example-image" src="dessert1.jpg" alt="" width="400px" height="300px"/></a>
                <a class="example-image-link" href="dessert2.jpg" data-lightbox="example-set" data-title="Click anywhere outside the image or the X to the right to close."><img class="example-image" src="dessert2.jpg" alt="" width="400px" height="300px"/></a>
                <a class="example-image-link" href="dessert3.jpg" data-lightbox="example-set" data-title="The next image in the set is preloaded as you're viewing."><img class="example-image" src="dessert3.jpg" alt="" width="400px" height="300px"/></a>
                <a class="example-image-link" href="dessert4.jpg" data-lightbox="example-set" data-title="Click anywhere outside the image or the X to the right to close."><img class="example-image" src="dessert4.jpg" alt="" width="400px" height="300px"/></a>
              </div>
        </section>

            <div class="community">
                <ul class="ig">
                    <li>
                        <a href="#"><i class="fa-brands fa-square-instagram"></i></a>
                    </li>
                </ul>
                <ul class="fb">
                    <li>
                        <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    </li>
                </ul>
                <ul class="line">
                    <li>
                        <a href="#"><i class="fa-brands fa-line"></i></a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <script src="lightbox2-2.11.4/dist/js/lightbox-plus-jquery.min.js"></script>
